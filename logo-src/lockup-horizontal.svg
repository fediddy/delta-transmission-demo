<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 132" width="620" height="132" role="img" aria-label="Delta Transmission, Antioch California">
  <title>Delta Transmission horizontal lockup, for dark backgrounds</title>

  <!-- Lockup geometry: the mark occupies a 96x96 box anchored at x=8. All copy is
       baseline aligned to the mark's horizontal shaft (y=60.5 in mark space, which
       maps to y=64.5 here), so the tube reads as a rule under the wordmark. That
       alignment is the whole reason this lockup looks considered rather than stacked.
       NOTE: this SVG uses <text>, so it needs Archivo Black present. The PNG
       exports bake the font in; use those for anything that must be pixel exact. -->

  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#f2f6fa"/>
      <stop offset=".38"  stop-color="#c8d0da"/>
      <stop offset=".60"  stop-color="#79838f"/>
      <stop offset="1"    stop-color="#3f454d"/>
    </linearGradient>
    <clipPath id="shaftclip">
      <rect x="10" y="53.5" width="92" height="14" rx="3"/>
    </clipPath>
  </defs>

  <!-- mark, translated into the lockup -->
  <g transform="translate(8,10)">
    <path d="M48 13.5 L85.5 76.5 L10.5 76.5 Z"
          fill="none" stroke="#c2cad4" stroke-width="7" stroke-linejoin="round"/>
    <rect x="2" y="53.5" width="92" height="14" rx="3" fill="url(#steel)"/>
    <rect x="2" y="55.6" width="92" height="2" rx="1" fill="#ffffff" opacity=".5" clip-path="url(#shaftclip)"/>
    <g clip-path="url(#shaftclip)" stroke="#4f5862" stroke-width="1.7" opacity=".9">
      <line x1="24.5" y1="53.5" x2="24.5" y2="67.5"/>
      <line x1="71.5" y1="53.5" x2="71.5" y2="67.5"/>
    </g>
    <g stroke="#ff4d1c" stroke-linecap="round" fill="none">
      <line x1="48" y1="49" x2="48" y2="72" stroke-width="3.6"/>
      <line x1="39.5" y1="60.5" x2="56.5" y2="60.5" stroke-width="3.6"/>
    </g>
    <circle cx="48" cy="60.5" r="2.9" fill="#12141a"/>
    <circle cx="48" cy="60.5" r="1.15" fill="#ff4d1c"/>
  </g>

  <!-- wordmark -->
  <text x="126" y="60" font-family="'Archivo Black','Arial Black',Impact,sans-serif"
        font-size="43" font-weight="400" letter-spacing="-1.6" fill="#eef2f7">DELTA</text>
  <text x="126" y="98" font-family="'Archivo Black','Arial Black',Impact,sans-serif"
        font-size="43" font-weight="400" letter-spacing="-1.6" fill="#ff4d1c">TRANSMISSION</text>

  <!-- descriptor, set small and tracked out so it reads as a plate stamp -->
  <text x="128" y="118" font-family="'Archivo',system-ui,sans-serif"
        font-size="12.5" font-weight="600" letter-spacing="3.1" fill="#8b95a3">ANTIOCH, CALIFORNIA</text>
  <line x1="128" y1="106.5" x2="286" y2="106.5" stroke="#2b323b" stroke-width="1"/>
  <text x="294" y="118" font-family="'Archivo',system-ui,sans-serif"
        font-size="12.5" font-weight="600" letter-spacing="3.1" fill="#8b95a3">SINCE 1958</text>
</svg>
