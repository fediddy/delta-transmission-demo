<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Delta Transmission">
  <title>Delta Transmission mark</title>

  <!-- THE IDEA: the delta IS the driveline.
       A bold Greek delta. A driveshaft passes through it, with a U-joint cross
       seated IN the shaft. Two readings from one mark: the letter that names the
       shop, and the thing the shop actually does. -->

  <!-- FOUR BUGS FIXED 2026-09-21. Each one is worth remembering:
       (1) The U-joint cross was stroked with a linearGradient in objectBoundingBox
           units. That gradient is DEGENERATE on a perfectly vertical or horizontal
           line, because such a line's bounding box has zero width or zero height.
           The cross rendered invisible. Axis aligned strokes use SOLID colour.
       (2) A double hyphen inside an XML comment is ILLEGAL and breaks the whole
           document. Chrome rendered a broken icon and nothing else.
       (3) First correction overshot: the cross spanned nearly the full mark and
           the driveshaft stopped reading as a shaft at all. A U-joint is roughly
           1.5x the tube diameter, NOT the height of the whole logo.
       (4) The tube was too thin to hold its own against the accent. Thickened, so
           the "shaft through the delta" reading wins at a glance. -->

  <defs>
    <!-- Machined steel: light along the top edge, dark along the bottom, so the
         shaft reads as a turned cylinder rather than a flat bar. Safe here because
         it fills a rect and strokes a diagonal path, so a bounding box exists. -->
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#f2f6fa"/>
      <stop offset=".38"  stop-color="#c8d0da"/>
      <stop offset=".60"  stop-color="#79838f"/>
      <stop offset="1"    stop-color="#3f454d"/>
    </linearGradient>
    <clipPath id="shaftclip">
      <rect x="2" y="53.5" width="92" height="14" rx="3"/>
    </clipPath>
  </defs>

  <!-- the delta -->
  <path d="M48 13.5 L85.5 76.5 L10.5 76.5 Z"
        fill="none" stroke="#c2cad4" stroke-width="7"
        stroke-linejoin="round"/>

  <!-- the driveshaft: thicker, and passing THROUGH the delta past both legs -->
  <rect x="2" y="53.5" width="92" height="14" rx="3" fill="url(#steel)"/>
  <!-- machined highlight along the top of the tube, sells it as a cylinder -->
  <rect x="2" y="55.6" width="92" height="2" rx="1" fill="#ffffff" opacity=".5" clip-path="url(#shaftclip)"/>

  <!-- weld seams where the tube meets the legs. First to go at small size. -->
  <g clip-path="url(#shaftclip)" stroke="#4f5862" stroke-width="1.7" opacity=".9">
    <line x1="24.5" y1="53.5" x2="24.5" y2="67.5"/>
    <line x1="71.5" y1="53.5" x2="71.5" y2="67.5"/>
  </g>

  <!-- U-JOINT CROSS, seated in the tube. Scaled to a real joint, roughly 1.5x the
       tube diameter, not the height of the mark. -->
  <g stroke="#ff4d1c" stroke-linecap="round" fill="none">
    <line x1="48" y1="49" x2="48" y2="72" stroke-width="3.6"/>
    <line x1="39.5" y1="60.5" x2="56.5" y2="60.5" stroke-width="3.6"/>
  </g>
  <circle cx="48" cy="60.5" r="2.9" fill="#12141a"/>
  <circle cx="48" cy="60.5" r="1.15" fill="#ff4d1c"/>
</svg>
